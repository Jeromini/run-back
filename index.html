<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2">
<meta name="description" content="Fasting, training and nutrition in one coach. Run Back times your training around your fast.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Run Back">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Run Back</title>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="hdr-r">
      <span class="sync" id="sync" role="status"></span>
      <button class="iconbtn" data-act="open-guides" aria-label="Guides"></button>
      <button class="iconbtn" data-act="go-more" aria-label="More: profile, crew, guides and settings"></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Main">
  <button data-act="tab" data-v="today">Today</button>
  <button data-act="tab" data-v="journey">Journey</button>
  <button data-act="tab" data-v="fast">Fast</button>
  <button data-act="tab" data-v="food">Diet</button>
  <button data-act="tab" data-v="trends">Progress</button>
</nav>
<button class="fab" id="fab" data-act="quick-add" aria-label="Log something"></button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden>
  <div class="sh-top"><button class="iconbtn" data-act="sheet-close" aria-label="Back" id="sh-back"></button><h2 class="t" id="sh-title"></h2></div>
  <div class="sh-body" id="sh-body"></div>
</div>

<div class="wk" id="wk" hidden><div class="inner" id="wk-inner"></div></div>

<div class="auth" id="auth" hidden></div>

<div class="stagepop" id="stagepop" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
